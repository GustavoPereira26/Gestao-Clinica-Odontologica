<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="Gerenciamento de funcionários da Dentus Clinic — visualize, adicione e gerencie sua equipe." />
    <title>Dentus Clinic — Funcionários</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/admin/funcionarios.css" />
</head>

<body>

    <!-- ═══ LAYOUT ═══ -->
    <div class="app-layout">

        <!-- Botão Hamburger (mobile) -->
        <button class="btn-hamburger" id="btnHamburger" aria-label="Abrir menu">
            <i class="fa-solid fa-bars"></i>
        </button>

        <!-- Sidebar (renderizada via JS) -->
        <div id="sidebarContainer"></div>

        <!-- ═══ CONTEÚDO PRINCIPAL ═══ -->
        <main class="app-content" id="mainContent">

            <!-- Header da página -->
            <header class="page-header" id="pageHeader">
                <h1 class="page-title" id="pageTitle">Funcionários</h1>
                <p class="page-subtitle" id="pageSubtitle">Gerencie a equipe da Dentus Clinic</p>
            </header>

            <!-- Lista de Funcionários -->
            <div id="listaFuncionarios">
                <!-- Barra de pesquisa e filtro -->
                <div class="toolbar" id="toolbar">
                    <div class="search-box" id="searchBox">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input type="text" class="search-input" id="searchInput" placeholder="Buscar funcionário..."
                            autocomplete="off" />
                    </div>
                    <div class="filter-group" id="filterGroup">
                        <button class="filter-chip active" data-filter="todos" id="filterTodos">Todos</button>
                        <button class="filter-chip" data-filter="secretaria" id="filterSecretaria">Secretária</button>
                        <button class="filter-chip" data-filter="dentista" id="filterDentista">Dentista</button>
                        <button class="filter-chip" data-filter="administrador" id="filterTI">ADM</button>
                    </div>
                </div>

                <!-- Grid de Funcionários -->
                <section class="grid-funcionarios" id="gridFuncionarios">
                    <!-- Cards renderizados via JS -->
                </section>

                <!-- Botão Adicionar Funcionário (FAB) -->
                <button class="btn-add-funcionario" id="btnAddFuncionario" title="Adicionar Funcionário">
                    <i class="fa-solid fa-plus"></i>
                    <span>Adicionar Funcionário</span>
                </button>
            </div>

            <!-- Visualizar Funcionário -->
            <div id="visualizarFuncionario" class="d-none pb-5">
                <div class="container-fluid px-0">
                    <!-- Botão Voltar -->
                    <div class="mb-4 mt-2">
                        <button class="btn btn-outline-secondary d-inline-flex align-items-center gap-2"
                            id="btnVoltarVisualizar">
                            <i class="fa-solid fa-arrow-left"></i> Voltar
                        </button>
                    </div>

                    <!-- Card Central -->
                    <div class="row justify-content-center">
                        <div class="col-12 col-md-10 col-lg-8 col-xl-6">
                            <div class="card shadow-sm p-4 border-0 rounded-3">

                                <!-- Título -->
                                <h4 class="fw-bold mb-4 text-center">Informações do Funcionário</h4>

                                <!-- Foto do funcionário -->
                                <div class="text-center mb-4">
                                    <div class="d-inline-flex border rounded-3 justify-content-center align-items-center mb-3 position-relative overflow-hidden"
                                        style="width: 150px; height: 150px; background-color: #f8f9fa;">
                                        <i class="fa-solid fa-user text-secondary" style="font-size: 5rem;"
                                            id="iconeFotoPadrao"></i>
                                        <img src="" alt="Foto do Funcionário" id="previewFoto" class="d-none"
                                            style="width: 100%; height: 100%; object-fit: cover;">
                                    </div>
                                    <div>
                                        <input type="file" id="inputSubirFoto" accept="image/*" class="d-none"
                                            onchange="FuncionariosPage.lidarUploadFoto(event)">
                                        <button type="button" class="btn btn-sm btn-primary"
                                            onclick="FuncionariosPage.acionarInputFoto()">Subir Foto</button>
                                    </div>
                                </div>

                                <!-- Formulário -->
                                <form id="formVisualizar">
                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Cargo</label>
                                        <input type="text" class="form-control" id="visCargo" readonly />
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Nome</label>
                                        <input type="text" class="form-control" id="visNome" readonly />
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">CPF</label>
                                        <input type="text" class="form-control" id="visCpf" readonly />
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">E-mail</label>
                                        <div class="input-group">
                                            <input type="text" class="form-control border-end-0" id="visEmail" readonly />
                                            <span class="input-group-text bg-transparent border-start-0" style="cursor:pointer;" onclick="FuncionariosPage.abrirModalEdicao('email')" title="Editar e-mail">
                                                <i class="fa-solid fa-pencil text-secondary" style="font-size:0.8rem;"></i>
                                            </span>
                                        </div>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label fw-semibold">Telefone</label>
                                        <div class="input-group">
                                            <input type="text" class="form-control border-end-0" id="visTelefone" readonly />
                                            <span class="input-group-text bg-transparent border-start-0" style="cursor:pointer;" onclick="FuncionariosPage.abrirModalEdicao('telefone')" title="Editar telefone">
                                                <i class="fa-solid fa-pencil text-secondary" style="font-size:0.8rem;"></i>
                                            </span>
                                        </div>
                                    </div>

                                    <div class="mb-3" id="visDataNascimentoContainer">
                                        <label class="form-label fw-semibold">Data de Nascimento</label>
                                        <input type="text" class="form-control" id="visDataNascimento" readonly />
                                    </div>

                                    <div class="mb-3" id="visCROContainer">
                                        <label class="form-label fw-semibold">CRO</label>
                                        <input type="text" class="form-control" id="visCRO" readonly />
                                    </div>

                                    <div class="mb-4" id="visEspecialidadeContainer">
                                        <label class="form-label fw-semibold">Especialidade</label>
                                        <input type="text" class="form-control" id="visEspecialidade" readonly />
                                    </div>

                                    <!-- Botões de Ação -->
                                    <div
                                        class="d-flex flex-column flex-sm-row justify-content-between gap-3 mt-4 pt-3 border-top">
                                        <button type="button"
                                            class="btn btn-outline-secondary d-flex align-items-center justify-content-center gap-2"
                                            data-bs-toggle="modal" data-bs-target="#modalRestaurarSenha">
                                            <i class="fa-solid fa-rotate"></i>
                                            Restaurar Senha
                                        </button>
                                        <button type="button" class="btn d-flex align-items-center justify-content-center gap-2 text-white" data-bs-toggle="modal" data-bs-target="#modalDeletarFuncionario" style="background-color:#c0392b; border-color:#c0392b;">
                                            <i class="fa-solid fa-user-slash"></i>
                                            Inativar Conta
                                        </button>
                                    </div>
                                </form>

                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cadastro de Funcionário -->
            <div id="cadastrarFuncionario" class="d-none pb-5">
                <div class="container-fluid px-0">
                    <div class="row justify-content-center mt-4">
                        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                            <div class="card shadow-sm p-4 border-0 rounded-3 text-center"
                                style="background-color: #f8f9fa;">
                                <h4 class="fw-bold mb-4">Cadastro de Funcionario</h4>

                                <div id="alertaCadastro" class="alert alert-danger d-none mb-3" role="alert"></div>

                                <form id="formCadastrar" class="text-start">
                                    <div class="mb-3">
                                        <label class="form-label mb-1" style="font-size: 0.9rem;">Cargo</label>
                                        <select class="form-select" id="cadCargo">
                                            <option value="DENTISTA">Dentista</option>
                                            <option value="SECRETARIA">Secretária</option>
                                            <option value="ADMINISTRADOR">Administrador</option>
                                        </select>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label mb-1" style="font-size: 0.9rem;">Nome</label>
                                        <input type="text" class="form-control" id="cadNome" />
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label mb-1" style="font-size: 0.9rem;">CPF</label>
                                        <input type="text" class="form-control" id="cadCpf" maxlength="14" placeholder="000.000.000-00" />
                                    </div>

                                    <div class="mb-3" id="campoDtNascimento">
                                        <label class="form-label mb-1" style="font-size: 0.9rem;">Data de Nascimento</label>
                                        <input type="date" class="form-control" id="cadDataNascimento" />
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label mb-1" style="font-size: 0.9rem;">Telefone</label>
                                        <input type="text" class="form-control" id="cadTelefone" />
                                    </div>

                                    <div class="mb-3 d-none" id="campoCRO">
                                        <label class="form-label mb-1" style="font-size: 0.9rem;">CRO</label>
                                        <input type="text" class="form-control" id="cadCRO" />
                                    </div>

                                    <div class="mb-3 d-none" id="campoEspecialidade">
                                        <label class="form-label mb-1" style="font-size: 0.9rem;">Especialidade</label>
                                        <select class="form-select" id="cadEspecialidade">
                                            <option value="">Carregando...</option>
                                        </select>
                                    </div>

                                    <div class="mb-3">
                                        <label class="form-label mb-1" style="font-size: 0.9rem;">Email</label>
                                        <input type="email" class="form-control" id="cadEmail" />
                                    </div>

                                    <div class="mb-4">
                                        <label class="form-label mb-1" style="font-size: 0.9rem;">Senha</label>
                                        <input type="password" class="form-control" id="cadSenha" />
                                    </div>

                                    <div class="d-flex flex-column gap-2 mt-4">
                                        <button type="button" class="btn btn-primary fw-semibold py-2"
                                            onclick="FuncionariosPage.confirmarCadastro()" style="border-radius: 8px;">
                                            Cadastrar
                                        </button>
                                        <button type="button" class="btn fw-semibold py-2 text-dark bg-white" onclick="FuncionariosPage.cancelarCadastro()" style="border-radius: 8px; border: 1px solid #ccc;">
                                            Cancelar
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Inativar Funcionário -->
            <div class="modal fade" id="modalDeletarFuncionario" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title fs-6">Inativar Funcionário</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body d-flex flex-column align-items-center text-center mt-3">
                            <div class="mb-3 p-3 border rounded-circle d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                                <i class="fa-solid fa-user-slash fs-2"></i>
                            </div>
                            <h6 class="mb-2 fw-semibold">Tem certeza que deseja inativar este funcionário?</h6>
                            <small class="text-muted">O funcionário não aparecerá mais nas listagens</small>
                            <div id="alertaInativarFuncionario" class="alert alert-danger d-none mt-3 w-100 text-start" style="font-size:0.85rem;"></div>
                            <div class="d-flex justify-content-center gap-3 mt-4 mb-2">
                                <button type="button" class="btn btn-outline-secondary px-4 text-dark bg-white border-dark" data-bs-dismiss="modal" style="border-radius: 8px;">Cancelar</button>
                                <button type="button" class="btn btn-danger px-4 d-flex align-items-center gap-2" id="btnConfirmarInativar" onclick="FuncionariosPage.confirmarDeletar()" style="border-radius: 8px; background-color: #d9534f; border-color: #d9534f;">
                                    <i class="fa-solid fa-user-slash"></i> INATIVAR
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Restaurar Senha -->
            <div class="modal fade" id="modalRestaurarSenha" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <!-- Header -->
                        <div class="modal-header">
                            <h5 class="modal-title fs-6">Restaurar Senha</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"
                                onclick="FuncionariosPage.resetarModalRestaurar()"></button>
                        </div>

                        <div class="modal-body px-4 pb-4">
                            <div id="alertaRestaurar" class="alert alert-danger d-none mb-3"></div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nova Senha</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" id="novaSenhaInput" placeholder="Digite a nova senha" />
                                    <button class="btn btn-outline-secondary" type="button" id="toggleNovaSenha">
                                        <i class="fa-solid fa-eye-slash"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 mt-4">
                                <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal" onclick="FuncionariosPage.resetarModalRestaurar()">Cancelar</button>
                                <button type="button" class="btn btn-primary px-4" onclick="FuncionariosPage.confirmarRestaurarSenha()">Salvar</button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- Modal Editar E-mail / Telefone -->
            <div class="modal fade" id="modalEditarCampo" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
                <div class="modal-dialog modal-dialog-centered modal-sm">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title fs-6" id="modalEditarCampoTitulo">Editar</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onclick="FuncionariosPage.resetarModalEdicao()"></button>
                        </div>
                        <div class="modal-body px-4 pb-4">
                            <div id="alertaEdicaoCampo" class="alert alert-danger d-none mb-3"></div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold" id="modalEditarCampoLabel">Novo valor</label>
                                <input type="text" class="form-control" id="inputEditarCampo" />
                            </div>
                            <div class="d-flex justify-content-end gap-2 mt-3">
                                <button type="button" class="btn px-4 text-dark bg-white border" data-bs-dismiss="modal" onclick="FuncionariosPage.resetarModalEdicao()">Cancelar</button>
                                <button type="button" class="btn px-4 text-white" onclick="FuncionariosPage.confirmarEdicao()" style="background-color:#c0392b; border-color:#c0392b;">Continuar</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Modal Confirmar Alteração -->
            <div class="modal fade" id="modalConfirmarEdicao" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
                <div class="modal-dialog modal-dialog-centered modal-sm">
                    <div class="modal-content">
                        <div class="modal-header border-0 pb-0">
                            <h5 class="modal-title fw-bold">Confirmar Alteração</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" onclick="FuncionariosPage.resetarModalEdicao()"></button>
                        </div>
                        <div class="modal-body text-center py-3">
                            <div class="mb-3">
                                <i class="fa-solid fa-pen-to-square fa-2x text-primary"></i>
                            </div>
                            <p class="mb-1">Deseja alterar <strong id="confirmarEdicaoCampoLabel"></strong> para:</p>
                            <p class="fw-semibold text-break" id="confirmarEdicaoValor"></p>
                        </div>
                        <div class="modal-footer border-0 pt-0 justify-content-center gap-2">
                            <button type="button" class="btn px-4 text-dark bg-white border" data-bs-dismiss="modal" onclick="FuncionariosPage.resetarModalEdicao()">Cancelar</button>
                            <button type="button" class="btn px-4 text-white" onclick="FuncionariosPage.salvarEdicao()" style="background-color:#0d6efd; border-color:#0d6efd;">Confirmar</button>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Impotação do VLibras-->

    <div vw class="enabled">
        <div vw-access-button class="active"></div>
        <div vw-plugin-wrapper>
            <div class="vw-plugin-top-wrapper"></div>
        </div>
    </div>
    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
        new window.VLibras.Widget('https://vlibras.gov.br/app');
    </script>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Auth e API (ordem obrigatória) -->
    <script src="../js/auth.js"></script>
    <script src="../js/api.js"></script>
    <!-- Componentes -->
    <script src="../components/sidebar.js"></script>
    <!-- Componente de Configurações -->
    <script src="../components/settings.js"></script>
    <!-- JS da página -->
    <script src="../js/admin/funcionarios.js"></script>
</body>

</html>
