<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dentu's Clinic — Meus Pacientes</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />

  <!-- Estilos da página -->
  <link rel="stylesheet" href="../css/dentista/pacientes.css" />
</head>

<body>

  <!-- Layout principal -->
  <div class="app-layout">

    <!-- ═══ SIDEBAR (renderizada pelo componente) ═══ -->
    <div id="sidebarContainer"></div>

    <!-- ═══ CONTEÚDO ═══ -->
    <main class="app-content">

      <div class="container py-3">

        <header class="mobile-header d-flex align-items-center mb-4">
          <button class="btn-hamburger-mobile d-lg-none" id="btnHamburgerMobile" aria-label="Abrir menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <h1 class="mobile-header-title ms-3 mb-0">Consultas Agendadas</h1>
        </header>

        <!-- Barra de Filtros -->
        <section class="filter-card-mobile" id="filterBar">
          <div class="row g-3">
            <div class="col-12">
              <div class="filter-input-wrapper">
                <i class="fa-solid fa-magnifying-glass filter-input-icon"></i>
                <input type="text" class="filter-input" id="filterNome" placeholder="Buscar paciente por nome..." autocomplete="off" />
              </div>
            </div>
            <div class="col-12 col-md-6">
              <div class="filter-input-wrapper">
                <i class="fa-regular fa-id-card filter-input-icon"></i>
                <input type="text" class="filter-input" id="filterCpf" placeholder="CPF" autocomplete="off" />
              </div>
            </div>
            <div class="col-12 col-md-6">
              <div class="filter-input-wrapper">
                <i class="fa-solid fa-stethoscope filter-input-icon"></i>
                <select class="filter-input" id="filterServico">
                  <option value="">Todos os Serviços</option>
                  <option value="Limpeza">Limpeza</option>
                  <option value="Extração">Extração</option>
                  <option value="Clareamento">Clareamento</option>
                  <option value="Restauração">Restauração</option>
                  <option value="Check-up">Check-up</option>
                  <option value="Periodontia">Periodontia</option>
                </select>
              </div>
            </div>
            <div class="col-6">
              <div class="filter-input-wrapper">
                <i class="fa-solid fa-phone filter-input-icon"></i>
                <input type="text" class="filter-input" id="filterTelefone" placeholder="Telefone" autocomplete="off" />
              </div>
            </div>
            <div class="col-6">
              <div class="filter-input-wrapper">
                <i class="fa-regular fa-calendar filter-input-icon"></i>
                <input type="text" class="filter-input" id="filterConsulta" placeholder="Data" maxlength="10" autocomplete="off" />
              </div>
            </div>
            <div class="col-12 d-flex justify-content-end mt-1">
              <button class="btn-filter-clear-mobile" id="btnClearFilters">Limpar</button>
            </div>
          </div>
        </section>

        <h2 class="section-title-mobile mb-3">Agendamentos</h2>

        <!-- Cards Container -->
        <div class="patient-cards-list" id="pacientesCardsList">
          <!-- Renderizado via JS -->
        </div>

        <div class="text-center py-5 text-muted d-none" id="emptyState">
          <i class="fa-regular fa-calendar-xmark fa-2x mb-3 d-block"></i>
          <p class="mb-0">Nenhuma consulta encontrada</p>
        </div>

      </div>
    </main>
  </div>

  <!-- Modal Detalhes do Paciente -->
  <div class="modal fade" id="detalhesModal" tabindex="-1" aria-labelledby="detalhesModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius: 16px; border: none; background-color: #FAF9F6; box-shadow: 0 10px 30px rgba(110, 84, 48, 0.15);">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title" id="detalhesModalLabel" style="color: #6e5430; font-weight: 700; font-size: 1.3rem;">Detalhes do Agendamento</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body pt-4 pb-4">
          <div class="text-center mb-4">
            <h3 id="modalNome" style="color: #4a3520; font-weight: 700; margin-bottom: 0.5rem; font-size: 1.5rem;">Nome do Paciente</h3>
            <span id="modalServico" class="badge" style="background-color: rgba(110, 84, 48, 0.1); color: #6e5430; font-size: 0.95rem; padding: 0.4rem 0.8rem; border-radius: 6px;">Serviço</span>
          </div>
          
          <div class="row g-3">
            <div class="col-6">
              <label style="font-size: 0.75rem; color: #a68a64; font-weight: 600; text-transform: uppercase;">CPF</label>
              <div id="modalCpf" style="color: #6e5430; font-weight: 500;">000.000.000-00</div>
            </div>
            <div class="col-6">
              <label style="font-size: 0.75rem; color: #a68a64; font-weight: 600; text-transform: uppercase;">Telefone</label>
              <div id="modalTelefone" style="color: #6e5430; font-weight: 500;">(00) 00000-0000</div>
            </div>
            <div class="col-6">
              <label style="font-size: 0.75rem; color: #a68a64; font-weight: 600; text-transform: uppercase;">Data</label>
              <div id="modalConsulta" style="color: #6e5430; font-weight: 500;">00/00/0000</div>
            </div>
            <div class="col-6">
              <label style="font-size: 0.75rem; color: #a68a64; font-weight: 600; text-transform: uppercase;">Horário</label>
              <div id="modalHora" style="color: #6e5430; font-weight: 500;">--:--</div>
            </div>
            <div class="col-12">
              <label style="font-size: 0.75rem; color: #a68a64; font-weight: 600; text-transform: uppercase;">Status</label>
              <div id="modalStatus" style="color: #6e5430; font-weight: 500;">—</div>
            </div>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0 pb-3 justify-content-center">
          <button type="button" class="btn w-100" data-bs-dismiss="modal" style="background-color: #6e5430; color: #fff; font-weight: 600; border-radius: 8px; padding: 0.75rem;">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Impotação do VLibras-->

  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper>
      <div class="vw-plugin-top-wrapper"></div>
    </div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>
    new window.VLibras.Widget('https://vlibras.gov.br/app');
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Componente Sidebar -->
  <script src="../components/sidebar.js"></script>
  <!-- Componente de Configurações -->
  <script src="../components/settings.js"></script>

  <!-- API e Auth -->
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>

  <!-- Lógica da página -->
  <script src="../js/dentista/pacientes.js?v=3"></script>

</body>

</html>
