<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dentu's Clinic — Página Inicial</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/recepcionista/dashboard.css" />
  <!-- Estilos da página -->
  <link rel="stylesheet" href="../css/recepcionista/dashboard.css"/>
</head>
<body>

<!-- Botão hamburguer (mobile) -->
<button class="btn-hamburger" id="btnHamburger" aria-label="Abrir menu">
  <i class="fa-solid fa-bars"></i>
</button>

<!-- Layout principal -->
<div class="app-layout">

  <!-- ═══ SIDEBAR (renderizada pelo componente) ═══ -->
  <div id="sidebarContainer"></div>

  <!-- ═══ CONTEÚDO ═══ -->
  <main class="app-content">

    <!-- Botões de ação a esquerda-->
    <div class="dashboard-actions">
      <!-- Esquerda -->
      <button class="btn-action" id="btnAgendar">
        <i class="fa-solid fa-calendar-plus"></i>
        Agendar Consulta
      </button>

      <!--Botões de ação a Direita -->
      <div class="dashboard-actions-right">
        <button class="btn-action" id="btnVisualizarPaciente">
          <i class="fa-solid fa-address-book"></i>
          Visualizar Paciente
        </button>
        <button class="btn-action" id="btnCadastrarPaciente">
          <i class="fa-solid fa-user-plus"></i>
          Cadastrar Paciente
        </button>
      </div>
    </div>

    <!-- Consultas do dia -->
    <h2 class="section-title">Consultas do dia</h2>

    <div class="table-wrapper">
      <div class="table-scroll">
        <table class="consultas-table" id="tabelaConsultas">
          <thead>
            <tr>
              <th>Nome do paciente</th>
              <th>Hora</th>
              <th>Doutor responsável</th>
              <th>Serviço Odontológico</th>
              <th style="text-align:center;">Status</th>
            </tr>
          </thead>
          <tbody id="tbodyConsultasDia">
            <!-- Preenchido pelo JS -->
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div><!-- /app-layout -->

<!-- Impotação do VLibras-->

<div vw class="enabled">
  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
  </div>
</div>
<script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
<script>
  new window.VLibras.Widget('https://vlibras.gov.br/app');
</script>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Componente Sidebar -->
<script src="../components/sidebar.js"></script>
<!-- Componente de Configurações -->
<script src="../components/settings.js"></script>
<!-- API e Auth -->
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<!-- Lógica da página -->
<script src="../js/recepcionista/dashboard.js"></script>

</body>
</html>
