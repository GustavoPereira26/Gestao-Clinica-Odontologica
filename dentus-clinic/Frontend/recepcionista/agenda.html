<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dentu's Clinic — Agenda</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../css/variables.css" />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/layout.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/recepcionista/agenda.css" />
</head>
<body>

  <!-- Botão hamburguer (mobile) -->
  <button class="btn-hamburger" id="btnHamburger" aria-label="Abrir menu">
    <i class="fa-solid fa-bars"></i>
  </button>

  <div class="app-layout">

    <div id="sidebarContainer"></div>

    <main class="app-content">

      <!-- Header -->
      <header class="page-header">
        <div class="page-header-left">
          <h1 class="page-title">
            <i class="fa-solid fa-calendar-check page-title-icon"></i>
            Agenda
          </h1>
          <p class="page-subtitle">Visualize os horários do dentista e agende consultas</p>
        </div>
      </header>

      <!-- Filtros -->
      <section class="agenda-filters">

        <div class="agenda-filter-field agenda-filter-field--dentista">
          <label class="filter-label" for="selectDentista">Dentista</label>
          <div class="filter-input-wrapper">
            <i class="fa-solid fa-user-doctor filter-input-icon"></i>
            <select class="filter-input filter-select" id="selectDentista">
              <option value="">Selecione um dentista...</option>
            </select>
          </div>
        </div>

        <div class="agenda-filter-separador"></div>

        <div class="agenda-filter-field agenda-filter-field--date">
          <label class="filter-label" for="inputData">Data</label>
          <div class="filter-input-wrapper">
            <input type="date" class="filter-input filter-input-date" id="inputData" />
          </div>
        </div>

        <div class="agenda-nav-group">
          <button class="btn-nav-dia btn-nav-prev" id="btnDiaAnterior" title="Dia anterior">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <button class="btn-nav-dia btn-nav-hoje" id="btnHoje" title="Ir para hoje">
            <i class="fa-solid fa-calendar-day"></i>
            Hoje
          </button>
          <button class="btn-nav-dia btn-nav-next" id="btnProximoDia" title="Próximo dia">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>

      </section>

      <!-- Legenda -->
      <div class="agenda-legenda" id="agendaLegenda" style="display:none;">
        <span class="legenda-item"><span class="legenda-cor legenda-livre"></span>Disponível</span>
        <span class="legenda-item"><span class="legenda-cor legenda-agendada"></span>Agendada</span>
        <span class="legenda-item"><span class="legenda-cor legenda-fila"></span>Em fila</span>
        <span class="legenda-item"><span class="legenda-cor legenda-consulta"></span>Em consulta</span>
        <span class="legenda-item"><span class="legenda-cor legenda-encerrada"></span>Encerrada</span>
        <span class="legenda-item"><span class="legenda-cor legenda-cancelada"></span>Cancelada</span>
      </div>

      <!-- Estado: selecione dentista -->
      <div class="agenda-placeholder" id="placeholderSelecioneDentista">
        <i class="fa-solid fa-user-doctor"></i>
        <p>Selecione um dentista para ver a agenda</p>
      </div>

      <!-- Grid da agenda -->
      <div class="agenda-grid-wrapper" id="agendaGridWrapper" style="display:none;">
        <div class="agenda-grid" id="agendaGrid">
          <!-- Preenchido pelo JS -->
        </div>
      </div>

    </main>
  </div>

  <!-- VLibras -->
  <div vw class="enabled">
    <div vw-access-button class="active"></div>
    <div vw-plugin-wrapper><div class="vw-plugin-top-wrapper"></div></div>
  </div>
  <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
  <script>new window.VLibras.Widget('https://vlibras.gov.br/app');</script>

  <!-- Modal Agendar via Agenda -->
  <div class="modal fade" id="modalAgendarSlot" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fs-6"><i class="fa-solid fa-calendar-plus me-2"></i>Agendar Consulta</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" onclick="AgendaPage.resetarModal()"></button>
        </div>
        <div class="modal-body px-4 pb-2">
          <div id="alertaAgendarSlot" class="alert alert-danger d-none mb-3"></div>

          <!-- Info do slot (read-only) -->
          <div class="slot-info-modal mb-3">
            <div class="slot-info-item">
              <i class="fa-solid fa-user-doctor"></i>
              <span id="modalNomeDentista">—</span>
            </div>
            <div class="slot-info-item">
              <i class="fa-solid fa-calendar"></i>
              <span id="modalDataFormatada">—</span>
            </div>
            <div class="slot-info-item">
              <i class="fa-solid fa-clock"></i>
              <span id="modalHoraFormatada">—</span>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Paciente <span class="text-danger">*</span></label>
            <div class="position-relative">
              <input type="text" class="form-control" id="slotPacienteSearch"
                     placeholder="Digite o nome do paciente..." autocomplete="off" />
              <input type="hidden" id="slotPacienteId" />
              <div id="slotPacienteSugestoes"
                   class="list-group position-absolute w-100 shadow"
                   style="z-index:1060; max-height:180px; overflow-y:auto; display:none; border-radius:0 0 6px 6px;"></div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold">Serviço</label>
            <select class="form-select" id="slotServico">
              <option value="">Nenhum</option>
            </select>
          </div>

          <div class="mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="slotRetorno" />
              <label class="form-check-label" for="slotRetorno">É uma consulta de retorno?</label>
            </div>
          </div>
        </div>
        <div class="modal-footer border-0 pt-0 gap-2">
          <button type="button" class="btn px-4 text-dark bg-white border" data-bs-dismiss="modal" onclick="AgendaPage.resetarModal()">Cancelar</button>
          <button type="button" class="btn px-4 text-white" id="btnConfirmarAgendarSlot" onclick="AgendaPage.confirmarAgendamento()" style="background-color:#0d6efd; border-color:#0d6efd;">Agendar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../components/sidebar.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/recepcionista/agenda.js"></script>

</body>
</html>
